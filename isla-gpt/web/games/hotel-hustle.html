<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOTEL HUSTLE</title>
<meta name="theme-color" content="#14213d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Hotel Hustle: a cream, gold and navy hotel tycoon. Everything is in this one file. */
:root {
  --navy: #14213d;
  --navy2: #1d2f55;
  --navy3: #2b416e;
  --gold: #c9a227;
  --gold2: #e6c76a;
  --gold3: #f6e7b4;
  --cream: #faf5e9;
  --cream2: #f2e9d5;
  --cream3: #e7dbc0;
  --ink: #18213a;
  --muted: #6f6b5e;
  --good: #2f8f5b;
  --bad: #c0392b;
  --warn: #d98c1f;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --r: 14px;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--ink); }
body { font-family: var(--sans); font-size: 14px; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
.em { font-family: var(--emoji); font-style: normal; line-height: 1; }

/* ---------- layout ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 8px calc(12px + env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, #172647, var(--navy)); color: var(--cream); border-bottom: 2px solid var(--gold); z-index: 5; }
.brand { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.brand b { font-family: var(--serif); font-weight: 800; font-size: 18px; letter-spacing: .08em; color: var(--gold2); white-space: nowrap; }
.brand span { font-size: 12px; color: #c9cfdf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.spacer { flex: 1; }
.stat { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(230,199,106,.35); font-weight: 700; white-space: nowrap; }
.stat small { font-weight: 500; color: #b9c0d4; }
#hudMoney.neg { color: #ff9a8c; }
.stars { color: var(--gold2); letter-spacing: 1px; }
.stars .off { color: rgba(230,199,106,.28); }
.off { opacity: .3; }
.stars .off { opacity: 1; }
.tbtn { display: inline-grid; place-items: center; min-width: 36px; height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(230,199,106,.45); background: rgba(255,255,255,.06); color: var(--cream); font-weight: 700; }
.tbtn:hover { background: rgba(230,199,106,.18); }
.tbtn.on { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.speeds { display: flex; gap: 4px; }
#main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 410px; }
#sceneWrap { position: relative; min-height: 0; overflow: hidden; }
#panel { min-height: 0; display: flex; flex-direction: column; background: var(--cream); border-left: 2px solid var(--gold); }
#tabs { flex: none; display: flex; gap: 2px; padding: 6px 6px 0; background: var(--cream2); border-bottom: 1px solid var(--cream3); overflow-x: auto; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px 7px; border: 0; border-radius: 10px 10px 0 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }
.tab .em { font-size: 18px; }
.tab.on { background: var(--cream); color: var(--navy); box-shadow: inset 0 3px 0 var(--gold); }
.tab .cnt { position: absolute; top: 2px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
#panelBody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px calc(20px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

@media (max-width: 860px) {
  #main { grid-template-columns: 1fr; grid-template-rows: minmax(190px, 42%) minmax(0, 1fr); }
  #panel { border-left: 0; border-top: 2px solid var(--gold); }
  .brand span { max-width: 110px; }
  .hideS { display: none !important; }
  .tab { font-size: 11px; padding: 5px 6px 6px; }
}
@media (max-width: 520px) {
  #topbar { gap: 6px; padding-left: calc(8px + env(safe-area-inset-left, 0px)); padding-right: calc(8px + env(safe-area-inset-right, 0px)); flex-wrap: wrap; row-gap: 6px; }
  .brand b { font-size: 15px; }
  .stat { padding: 4px 8px; font-size: 13px; }
  .tbtn { min-width: 32px; height: 30px; padding: 0 7px; }
  .hideXS { display: none !important; }
}

/* ---------- panel content ---------- */
h2.ph { font-family: var(--serif); font-weight: 800; color: var(--navy); font-size: 20px; margin: 4px 0 10px; display: flex; align-items: center; gap: 8px; }
h3.sh { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
h3.sh::after { content: ""; flex: 1; height: 1px; background: var(--cream3); }
h3.sh:first-child { margin-top: 0; }
.card { background: #fff; border: 1px solid var(--cream3); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 0 rgba(20,33,61,.04); animation: pop .25s ease-out; }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.card.hot { border-color: #f0b8ae; background: #fff8f6; }
.card.gold { border-color: var(--gold2); background: linear-gradient(180deg, #fffdf6, #fff8e4); }
.row { display: flex; align-items: center; gap: 10px; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--emoji); font-size: 22px; background: var(--cream2); border: 2px solid var(--cream3); }
.av.vip { border-color: var(--gold); background: var(--gold3); }
.t1 { font-weight: 700; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t2 { font-size: 12px; color: var(--muted); margin-top: 1px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--cream2); color: var(--navy2); vertical-align: 1px; }
.tag.gold { background: var(--gold3); color: #7a5b00; }
.tag.red { background: #fde3df; color: var(--bad); }
.tag.green { background: #dff3e7; color: var(--good); }
.tag.blue { background: #e0e8f7; color: var(--navy2); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.b { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 34px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--navy); background: var(--navy); color: var(--cream); font-weight: 700; font-size: 13px; transition: transform .08s, filter .15s; }
.b:hover { filter: brightness(1.15); }
.b:active { transform: scale(.96); }
.b.gold { background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: #a8851a; color: var(--navy); }
.b.ghost { background: #fff; color: var(--navy); border-color: var(--cream3); }
.b.red { background: #fff; color: var(--bad); border-color: #efc3bc; }
.b.sm { min-height: 28px; padding: 3px 9px; font-size: 12px; border-radius: 8px; }
.b.wide { width: 100%; }
.b:disabled, .b.dis { opacity: .45; cursor: not-allowed; filter: grayscale(.4); transform: none; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--cream2); overflow: hidden; margin-top: 6px; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); border-radius: 3px; transition: width .3s linear; }
.bar.g > i { background: var(--good); }
.bar.r > i { background: var(--bad); }
.bar.n > i { background: var(--navy3); }
.empty { text-align: center; color: var(--muted); padding: 14px 8px; border: 1px dashed var(--cream3); border-radius: var(--r); font-size: 13px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv .v { font-weight: 700; text-align: right; }
.kv .tot { border-top: 1px solid var(--cream3); padding-top: 4px; font-weight: 700; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.big { font-family: var(--serif); font-size: 30px; font-weight: 800; color: var(--navy); line-height: 1; }
.lvl { color: var(--gold); letter-spacing: 2px; }
.lvl .off { color: var(--cream3); }
.price { display: flex; align-items: center; gap: 6px; }
.price b { min-width: 58px; text-align: center; font-size: 15px; }
.req { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
.req .ok { color: var(--good); font-weight: 700; } .req .no { color: var(--bad); font-weight: 700; }
.rv-stars { color: var(--gold); letter-spacing: 1px; }
.mgr { display: flex; align-items: center; gap: 8px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; color: var(--navy); }
.toggle input { width: 18px; height: 18px; accent-color: var(--gold); }
canvas.chart { width: 100%; height: 150px; display: block; background: #fff; border: 1px solid var(--cream3); border-radius: var(--r); }
.note { font-size: 12px; color: var(--muted); margin: 4px 0 0; }

/* ---------- the hotel scene ---------- */
#scene { position: absolute; inset: 0; overflow: hidden; background: #87b6e0; transition: background 1s linear; }
#sky { position: absolute; inset: 0; }
#sunmoon { position: absolute; width: 46px; height: 46px; border-radius: 50%; margin: -23px 0 0 -23px; transition: left .5s linear, top .5s linear, background .8s; }
.starfield { position: absolute; inset: 0; transition: opacity 2s; background-image: radial-gradient(1.4px 1.4px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 33% 9%, #fff 50%, transparent 51%), radial-gradient(1.6px 1.6px at 58% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 72% 12%, #fff 50%, transparent 51%), radial-gradient(1.3px 1.3px at 88% 28%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 46% 34%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 6% 40%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 95% 6%, #fff 50%, transparent 51%); }
.cloud { position: absolute; width: 120px; height: 34px; border-radius: 40px; background: rgba(255,255,255,.85); filter: blur(.5px); animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
.cloud::before { width: 54px; height: 50px; left: 18px; top: -24px; }
.cloud::after { width: 44px; height: 40px; left: 58px; top: -16px; }
@keyframes drift { from { transform: translateX(-180px); } to { transform: translateX(calc(100vw + 60px)); } }
#world { position: absolute; left: 50%; bottom: 0; width: 760px; transform-origin: 50% 100%; }
.skyline { position: absolute; bottom: 44px; background: #5d7ea3; opacity: .45; border-radius: 2px 2px 0 0; transition: background 1s; }
.street { position: absolute; left: -400px; right: -400px; bottom: 0; height: 44px; background: #3b4252; border-top: 6px solid #cfc6b0; }
.street::after { content: ""; position: absolute; left: 0; right: 0; top: 20px; height: 3px; background: repeating-linear-gradient(90deg, #f3e3a0 0 26px, transparent 26px 56px); opacity: .8; }
.car { position: absolute; bottom: 4px; font-family: var(--emoji); font-size: 22px; animation: carR linear infinite; }
.car.l { bottom: 20px; animation-name: carL; }
@keyframes carR { from { transform: translateX(-120px) scaleX(-1); } to { transform: translateX(1000px) scaleX(-1); } }
@keyframes carL { from { transform: translateX(1000px); } to { transform: translateX(-120px); } }
.tree { position: absolute; bottom: 44px; font-family: var(--emoji); font-size: 30px; }
.lamp { position: absolute; bottom: 44px; width: 4px; height: 54px; background: #2c3445; }
.lamp::before { content: ""; position: absolute; top: -6px; left: -6px; width: 16px; height: 8px; border-radius: 8px 8px 2px 2px; background: #2c3445; }
.lamp::after { content: ""; position: absolute; top: 2px; left: -4px; width: 12px; height: 6px; border-radius: 50%; background: #ffe9a0; opacity: 0; box-shadow: 0 0 18px 8px rgba(255,220,120,.6); transition: opacity 1s; }
.night .lamp::after { opacity: 1; }

#building { position: absolute; bottom: 44px; left: 199px; width: 362px; }
.roof { position: relative; height: 48px; background: linear-gradient(180deg, #1b2b4f, var(--navy)); border-radius: 6px 6px 0 0; border-bottom: 3px solid var(--gold); display: grid; place-items: center; }
.roof::before { content: ""; position: absolute; left: 10px; right: 10px; top: -8px; height: 8px; background: var(--navy2); border-radius: 4px 4px 0 0; }
.sign { font-family: var(--serif); font-weight: 800; color: var(--gold2); letter-spacing: .18em; font-size: 17px; text-shadow: 0 0 8px rgba(230,199,106,.5); text-align: center; line-height: 1; }
.sign small { display: block; font-family: var(--sans); letter-spacing: 2px; font-size: 10px; margin-top: 3px; }
.night .sign { text-shadow: 0 0 10px rgba(255,214,110,.95), 0 0 22px rgba(255,214,110,.6); }
.rooftop { position: absolute; left: 30px; right: 30px; bottom: 100%; height: 40px; margin-bottom: 8px; }
.rooftop .deck { position: absolute; inset: auto 0 0; height: 10px; background: #a07b3b; border-radius: 3px; }
.rooftop .lights { position: absolute; left: 0; right: 0; top: 4px; height: 12px; border-top: 2px dotted var(--gold2); border-radius: 50%; }
.night .rooftop .lights { filter: drop-shadow(0 0 4px #ffd36e); }
.rooftop .things { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: space-around; font-family: var(--emoji); font-size: 20px; }
.floors { background: var(--cream2); border-left: 6px solid var(--navy); border-right: 6px solid var(--navy); }
.floor { position: relative; height: 58px; display: flex; gap: 6px; padding: 6px 8px 0; border-bottom: 3px solid var(--cream3); background: linear-gradient(180deg, #f5ecd8, #eadfc4); }
.floor .fl { position: absolute; left: -26px; top: 18px; width: 18px; text-align: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--navy3); border-radius: 4px; }
.rm { position: relative; flex: 1; height: 46px; padding: 0; border: 2px solid #8a6f3a; border-radius: 5px 5px 2px 2px; background: #9cc3e4; overflow: hidden; display: block; transition: background .4s, box-shadow .3s; }
.rm:hover { box-shadow: 0 0 0 2px var(--gold2); }
.rm.sel { box-shadow: 0 0 0 3px var(--gold); }
.rm .glass { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.55) 0 18%, transparent 19% 40%, rgba(255,255,255,.25) 41% 48%, transparent 49%); }
.rm .cur { position: absolute; top: 0; bottom: 0; width: 34%; background: repeating-linear-gradient(90deg, #b5394f 0 4px, #9f2b41 4px 8px); transition: width .5s; }
.rm .cur.l { left: 0; } .rm .cur.r { right: 0; }
.rm .ico { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); font-family: var(--emoji); font-size: 20px; z-index: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.rm .num { position: absolute; left: 3px; bottom: 1px; font-size: 9px; font-weight: 700; color: rgba(20,33,61,.8); z-index: 1; background: rgba(255,255,255,.7); padding: 0 3px; border-radius: 3px; }
.rm .pb { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.25); z-index: 2; }
.rm .pb i { position: absolute; inset: 0 auto 0 0; width: 0; background: #7cf0a4; border-radius: 2px; }
.rm.st-clean .cur { width: 14%; }
.rm.st-occupied { background: #ffd98a; }
.rm.st-occupied .cur { width: 26%; }
.night .rm.st-occupied { background: #ffcc5c; box-shadow: 0 0 14px rgba(255,205,92,.7); }
.night .rm.st-clean { background: #36507a; }
.rm.st-dirty { background: #c8b28c; }
.rm.st-dirty .cur { width: 44%; filter: saturate(.4); }
.rm.st-cleaning { background: #c9e9d3; }
.rm.issue { animation: blink 1s steps(2) infinite; border-color: var(--bad); }
@keyframes blink { 50% { box-shadow: 0 0 0 3px rgba(192,57,43,.6); } }
.rm.deluxe { border-color: #b6922c; border-width: 3px; }
.rm.suite { border-color: var(--gold); border-width: 3px; box-shadow: inset 0 0 0 2px #fff3c4; }
.rm .tp { position: absolute; right: 2px; top: 1px; font-size: 9px; z-index: 1; color: #7a5b00; }
.rm.st-cleaning .ico { animation: scrub .6s ease-in-out infinite alternate; }
@keyframes scrub { from { transform: translate(-70%, -54%) rotate(-12deg); } to { transform: translate(-30%, -54%) rotate(12deg); } }
.sparkle { position: absolute; font-family: var(--emoji); font-size: 18px; pointer-events: none; animation: spark .9s ease-out forwards; z-index: 6; }
@keyframes spark { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.5) translateY(-10px); opacity: 0; } }

.ground { position: relative; height: 96px; background: linear-gradient(180deg, #efe4cc, #e4d6b6); border-left: 6px solid var(--navy); border-right: 6px solid var(--navy); display: flex; }
.lobby { position: relative; flex: 1.35; border-right: 4px solid var(--navy); background: linear-gradient(180deg, #fbf3e0 0 62%, #d9c49a 62%); overflow: hidden; }
.lobby .chand { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-family: var(--emoji); font-size: 16px; }
.night .lobby .chand { filter: drop-shadow(0 0 6px #ffd36e); }
.door { position: absolute; left: 8px; bottom: 0; width: 44px; height: 64px; border: 3px solid var(--gold); border-bottom: 0; border-radius: 22px 22px 0 0; background: linear-gradient(90deg, #a9cbe6 0 48%, var(--gold) 48% 52%, #a9cbe6 52%); }
.awning { position: absolute; left: 2px; bottom: 64px; width: 56px; height: 10px; background: var(--navy); border-radius: 4px; border-bottom: 2px solid var(--gold); }
.desk { position: absolute; right: 12px; bottom: 0; width: 64px; height: 30px; background: linear-gradient(180deg, var(--navy2), var(--navy)); border-top: 4px solid var(--gold); border-radius: 4px 4px 0 0; }
.desk .bell { position: absolute; right: 6px; top: -16px; font-family: var(--emoji); font-size: 12px; }
.desk .clerk { position: absolute; left: 18px; top: -30px; font-family: var(--emoji); font-size: 24px; }
.queue { position: absolute; left: 60px; right: 80px; bottom: 2px; height: 40px; display: flex; flex-direction: row-reverse; gap: 1px; align-items: flex-end; }
.qg { position: relative; padding: 0; border: 0; background: none; font-family: var(--emoji); font-size: 24px; line-height: 1; animation: walkin .7s ease-out; transition: transform .2s; }
.qg:hover { transform: translateY(-3px); }
.qg .mood { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 18px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.2); overflow: hidden; }
.qg .mood i { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.qg.angry { animation: shake .4s ease-in-out infinite; }
@keyframes walkin { from { transform: translateX(-90px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
.qmore { font-size: 11px; font-weight: 700; color: var(--navy); background: var(--gold3); border-radius: 8px; padding: 1px 5px; align-self: center; }
.depart { position: absolute; right: 80px; top: 6px; display: flex; gap: 2px; }
.depart button { padding: 0; border: 0; background: none; font-family: var(--emoji); font-size: 18px; animation: bob 1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-3px); } }
.resto { position: relative; flex: 1; background: linear-gradient(180deg, #fff4dd 0 60%, #b8875a 60%); overflow: hidden; }
.resto .rsign { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-family: var(--serif); font-weight: 800; font-size: 11px; color: var(--navy); letter-spacing: .1em; }
.resto .tables { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; justify-content: space-around; font-family: var(--emoji); font-size: 18px; }
.resto .chef { position: absolute; right: 6px; top: 18px; font-family: var(--emoji); font-size: 18px; }
.resto .chef.busy { animation: bob .4s ease-in-out infinite alternate; }
.resto .diners { position: absolute; left: 6px; top: 20px; font-family: var(--emoji); font-size: 15px; letter-spacing: -2px; }
.annex { position: absolute; bottom: 44px; width: 150px; display: flex; flex-direction: column-reverse; gap: 0; }
.annex.left { left: 44px; }
.annex.right { left: 566px; }
.fac { position: relative; height: 66px; border: 4px solid var(--navy); border-bottom-width: 0; background: linear-gradient(180deg, #f8efdb, #eadcbc); border-radius: 6px 6px 0 0; overflow: hidden; padding: 0; text-align: center; display: block; width: 100%; }

function beep(kind) {
  if (!ui.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const seq = { ding: [[1320, 0, .12], [1760, .09, .2]], cash: [[880, 0, .07], [1175, .06, .07], [1568, .12, .16]], bad: [[220, 0, .2], [180, .15, .25]], click: [[660, 0, .04]], star: [[523, 0, .15], [659, .12, .15], [784, .24, .15], [1047, .36, .4]], pop: [[990, 0, .06]] }[kind] || [[600, 0, .05]];
    const t0 = actx.currentTime;
    seq.forEach(([f, d, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'sawtooth' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(kind === 'bad' ? 0.05 : 0.12, t0 + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + len);
      o.connect(g); g.connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + len + 0.05);
    });
  } catch (e) {}
}

function makeGuest(kindKey, opts = {}) {
  const k = KINDS[kindKey];
  const avail = typesInHotel();
  let want;
  if (opts.want) want = opts.want;
  else {
    const r = Math.random(); want = r < k.want[0] ? 'standard' : r < k.want[0] + k.want[1] ? 'deluxe' : 'suite';
    if (!avail.includes(want)) want = avail.filter((t) => TYPE_ORDER.indexOf(t) <= TYPE_ORDER.indexOf(want)).pop() || 'standard';
  }
  const g = {
    id: nid(), kind: kindKey, name: opts.name || `${pick(FIRST)} ${pick(LAST)}`, em: opts.em || pick(k.em),
    want, nights: opts.nights || ri(k.nights[0], k.nights[1]), budget: k.budget * rnd(0.85, 1.25),
    mood: 68 + ri(-6, 6), status: 'queue', arrived: abs(), patience: opts.patience || ri(70, 120),
    roomId: null, checkoutDay: 0, leaveMin: 0, bill: [], notes: {}, car: chance(k.car), used: {}, discount: false,
    vip: !!opts.vip || kindKey === 'vip', inspector: !!opts.inspector, critic: !!opts.critic, celebrity: !!opts.celebrity, by: null,
  };
  if (g.inspector) { g.name = opts.name; g.mood -= 6; g.patience = 80; }
  return g;
}
function addNote(g, key) {

}
function nudge(g, d) { g.mood = clamp(g.mood + d, 0, 100); }

function demandPerDay() {
  const rooms = S.rooms.length;
  let d = (3 + rooms * 0.62) * (0.55 + (S.rating / 5) * 0.65) * (1 + 0.12 * (S.stars - 1));
  d *= 1 + S.marketing.reduce((a, m) => a + MARKETING.find((x) => x.id === m.id).boost, 0);
  if (S.fac.parking) d *= 1 + 0.07 * S.fac.parking;
  // price: cheaper than fair = more demand
  const types = typesInHotel();
  const ratio = types.reduce((a, t) => a + S.prices[t] / fairPrice(t), 0) / types.length;
  d *= clamp(1.75 - 0.75 * ratio, 0.25, 1.5);
  if (effect('festival')) d *= 1.5;
  if (effect('storm')) d *= 0.55;
  if (effect('viral')) d *= 1.3;
  return d;
}
function spawnArrivals() {
  const h = hour();
  if (h < 9 || h >= 23) return;
  const weight = h >= 12 && h < 20 ? 1.3 : h >= 20 ? 0.6 : 0.8; // averages about 1 across 9am-11pm
  const p = (demandPerDay() / (14 * 60)) * weight;
  if (chance(p)) {
    const pool = Object.entries(KINDS).filter(([, k]) => S.stars >= k.star);
    let tot = pool.reduce((a, [, k]) => a + k.w, 0), r = Math.random() * tot, key = pool[0][0];
    for (const [kk, k] of pool) { r -= k.w; if (r <= 0) { key = kk; break; } }
    if (effect('heatwave') && chance(0.3)) key = 'family';
    arrive(makeGuest(key));
  }
}
function arrive(g) {
  if (S.guests.filter((x) => x.status === 'queue').length >= 12 && !g.inspector && !g.celebrity) return; // lobby is full, they walk past
  S.guests.push(g);

}
function bestRoomFor(g) {
  const free = S.rooms.filter((r) => r.state === 'clean' && !r.issue && !r.guestId);
  if (!free.length) return null;
  const wi = TYPE_ORDER.indexOf(g.want);
  const byFit = (r) => { const ti = TYPE_ORDER.indexOf(r.type); return (ti === wi ? 0 : ti > wi ? 10 + (ti - wi) : 30 + (wi - ti)) - r.condition / 200 - r.decor / 20; };
  if (g.inspector) return free.sort((a, b) => (TYPE_ORDER.indexOf(b.type) - TYPE_ORDER.indexOf(a.type)) || (b.condition + b.decor * 10 - a.condition - a.decor * 10))[0];
  return free.sort((a, b) => byFit(a) - byFit(b))[0];
}
function freeRooms() { return S.rooms.filter((r) => r.state === 'clean' && !r.issue && !r.guestId); }

function checkIn(g, room, byStaff) {
  if (!g || g.status !== 'queue' || !room || room.state !== 'clean' || room.issue || room.guestId) return false;
  const wi = TYPE_ORDER.indexOf(g.want), ti = TYPE_ORDER.indexOf(room.type);
  const rateType = ti >= wi ? g.want : room.type;
  const rate = g.groupRate || S.prices[rateType];
  g.status = 'staying'; g.roomId = room.id; g.by = null;
  room.state = 'occupied'; room.guestId = g.id;
  g.checkoutDay = S.day + g.nights; g.leaveMin = ri(7 * 60, 11 * 60 + 30);
  g.bill.push({ label: `${ROOM_TYPES[room.type].name} room ${room.label} × ${plural(g.nights, 'night')}`, amount: rate * g.nights, kind: 'rooms' });
  if (g.car && S.fac.parking) { g.bill.push({ label: `Parking × ${plural(g.nights, 'night')}`, amount: FAC.parking.fee * g.nights, kind: 'facilities' }); addNote(g, 'parking'); }
  const waited = abs() - g.arrived;
  if (waited < 25) addNote(g, 'quickCheckin'); else if (waited > 75) addNote(g, 'longWait');
  if (ti > wi) addNote(g, 'upgraded'); else if (ti < wi) addNote(g, 'downgraded');
  // comfort, condition and value for money
  nudge(g, ROOM_TYPES[room.type].comfort * 0.6 + (room.decor - 1) * 4 + (room.condition - 72) / 5);
  if (room.type !== 'standard' && room.decor >= 2) addNote(g, 'luxury');
  if (room.condition < 45) addNote(g, 'shabby');
  const ratio = rate / fairPrice(rateType) / clamp(g.budget, 0.5, 2.5);
  if (ratio > 1.35) addNote(g, 'overpriced'); else if (ratio < 0.9) addNote(g, 'goodValue');
  nudge(g, -(S.stars - 1) * 3); // higher stars, higher expectations
  const likes = KINDS[g.kind].likes;
  if (likes.some((f) => !S.fac[f])) addNote(g, 'missing');
  S.today.checkins++;
  beep('ding');
  pop(roomEl(room.id), '🔑', '');
  toast(g.em, `${g.name} checked in to room ${room.label}${byStaff ? ` (by ${byStaff.name.split(' ')[0]})` : ''}.`);
  if (ti < wi && chance(0.5)) addComplaint(g, 'downgraded');

}
function checkOut(g, byStaff) {
  if (!g || g.status !== 'checkout') return;

  const paid = Math.round(total * paidShare);
  S.money += paid;
  for (const b of g.bill) S.today.rev[b.kind] = (S.today.rev[b.kind] || 0) + b.amount * paidShare;
  if (room) {
    room.state = 'dirty'; room.guestId = null; room.condition = clamp(room.condition - ri(2, 5) - g.nights, 0, 100);
    pop(roomEl(room.id), `+${money(paid)}`, '');
  }
  S.guestsServed++; S.today.guests++;
  const rv = writeReview(g);
  // remove the guest's leftover orders and complaints
  S.orders = S.orders.filter((o) => o.guestId !== g.id);
  S.complaints = S.complaints.filter((c) => c.guestId !== g.id);

function guestLeaves(g, why) {

function writeReview(g) {
  let mood = g.mood;
  if (g.inspector) mood -= 4;
  let stars = clamp(Math.round(mood / 20 + rnd(-0.35, 0.35) + 0.15), 1, 5);
  const pos = Object.keys(g.notes).filter((k) => NOTES[k][0] > 0), neg = Object.keys(g.notes).filter((k) => NOTES[k][0] < 0);
  const titles = { 5: ['Absolutely perfect!', 'Best hotel in town!', 'Five stars, no question', 'We will be back!'], 4: ['Really lovely stay', 'Great hotel', 'Very happy', 'Would recommend'], 3: ['It was okay', 'Not bad, not great', 'Average stay', 'Fine for a night'], 2: ['Disappointing', 'Expected more', 'Needs work', 'Not impressed'], 1: ['Never again!', 'Terrible stay', 'Avoid!', 'What a nightmare'] };
  const parts = [];
  const pp = pos.sort(() => Math.random() - 0.5), nn = neg.sort(() => Math.random() - 0.5);
  if (stars >= 4) { parts.push(...pp.slice(0, 2).map((k) => NOTES[k][1])); if (nn[0]) parts.push('Only thing: ' + NOTES[nn[0]][1].charAt(0).toLowerCase() + NOTES[nn[0]][1].slice(1)); }
  else if (stars === 3) { if (pp[0]) parts.push(NOTES[pp[0]][1]); if (nn[0]) parts.push('But ' + NOTES[nn[0]][1].charAt(0).toLowerCase() + NOTES[nn[0]][1].slice(1)); }
  else { parts.push(...nn.slice(0, 2).map((k) => NOTES[k][1])); if (pp[0] && stars === 2) parts.push('At least: ' + NOTES[pp[0]][1].charAt(0).toLowerCase() + NOTES[pp[0]][1].slice(1)); }
  if (!parts.length) parts.push(stars >= 4 ? 'Comfy bed and a nice room.' : stars === 3 ? 'Nothing special, but the bed was comfy.' : 'Not what we hoped for.');
  const rv = { id: nid(), name: g.name, em: g.em, day: S.day, stars, title: pick(titles[stars]), text: parts.join(' '), kind: g.kind, inspector: g.inspector, critic: g.critic, celeb: g.celebrity };
  if (g.critic) rv.title = (stars >= 4 ? 'Critic: ' : 'Critic: ') + rv.title;
  pushReview(rv);
  if (g.critic || g.celebrity) pushReview(Object.assign({}, rv, { id: nid() })); // their voice counts double

}
function pushReview(rv) {
  S.reviews.unshift(rv);

  const recent = S.reviews.slice(0, 40);
  const prior = 4, priorVal = 3;
  S.rating = Math.round(((recent.reduce((a, r) => a + r.stars, 0) + prior * priorVal) / (recent.length + prior)) * 100) / 100;

function addComplaint(g, issue) {
  if (!g || g.status !== 'staying') return;
  if (S.complaints.some((c) => c.guestId === g.id && c.issue === issue)) return;
  const def = ISSUES[issue] || { text: "We didn't get the room type we asked for.", label: 'Wrong room type', icon: '😒', repair: false };
  S.complaints.push({ id: nid(), guestId: g.id, roomId: g.roomId, issue, text: def.text, label: def.label, icon: def.icon, repair: !!def.repair, at: abs(), limit: 120, by: null });
  nudge(g, -4);
  beep('bad');
  toast(def.icon, `Complaint from room ${roomById(g.roomId) ? roomById(g.roomId).label : '?'}: ${def.label}`, 'bad');
}
function resolveComplaint(c, how, staff) {
  const g = guestById(c.guestId);
  S.complaints = S.complaints.filter((x) => x !== c);
  if (!g) return;
  if (how === 'apologise') { if (chance(0.55)) { nudge(g, 6); toast('🙏', `${g.name.split(' ')[0]} accepted your apology.`); } else { nudge(g, -5); toast('😒', `${g.name.split(' ')[0]} wasn't impressed by the apology.`, 'bad'); } }
  if (how === 'meal') { spend(30, 'other'); nudge(g, 12); addNote(g, 'handled'); toast('🍰', `Sent ${g.name.split(' ')[0]} a free treat.`); }
  if (how === 'discount') { const room = g.bill.filter((b) => b.kind === 'rooms').reduce((a, b) => a + b.amount, 0); g.bill.push({ label: '20% apology discount', amount: -Math.round(room * 0.2), kind: 'rooms' }); g.discount = true; nudge(g, 22); addNote(g, 'handled'); toast('💸', `Gave ${g.name.split(' ')[0]} 20% off their room.`); }
  if (how === 'fixed') { nudge(g, 10); addNote(g, 'handled'); }
  if (how === 'concierge') { nudge(g, 12); addNote(g, 'handled'); addNote(g, 'concierge'); toast('🛎️', `${staff.name.split(' ')[0]} calmed down ${g.name.split(' ')[0]}.`); }
  beep('click');
}
function breakRoom(room, issue) {
  if (room.issue) return;
  room.issue = issue;
  const g = room.guestId && guestById(room.guestId);
  if (g) { addNote(g, 'broken'); addComplaint(g, issue); }
}
function repairRoom(room) {
  if (!room.issue) return;
  room.issue = null;
  room.condition = clamp(room.condition + 6, 0, 100);
  sparkle(room.id, '🔧');

  if (c) resolveComplaint(c, 'fixed');

}

function menuNow() { return MENU.filter((d) => d.lvl <= S.fac.restaurant && !S.menuOff.includes(d.id)); }
function addOrder(g, critic) {

  const sorted = menu.slice().sort((a, b) => a.price - b.price);
  const dish = critic ? sorted[sorted.length - 1] : sorted[clamp(Math.floor(Math.random() * sorted.length * clamp(rich * 0.8, 0.3, 1)), 0, sorted.length - 1)];
  const qty = g.kind === 'family' ? ri(2, 4) : g.kind === 'couple' || g.kind === 'senior' ? 2 : 1;
  S.orders.push({ id: nid(), guestId: g.id, dish: dish.id, qty, status: 'new', at: abs(), readyAt: 0, job: 0, by: null, where: chance(0.5) ? 'room' : 'table', critic: !!critic });
}
function orderTotal(o) { const d = MENU.find((x) => x.id === o.dish); return d.price * o.qty; }
function cookTime(o, skill) { const d = MENU.find((x) => x.id === o.dish); return Math.round((d.time + o.qty * 3) / speedFor(skill)); }

function speedFor(skill) { return 0.55 + 0.15 * skill; }
function makeCandidate(role) {
  const skill = clamp(ri(1, 3) + (chance(0.15 + S.stars * 0.05) ? ri(1, 2) : 0), 1, 5);
  const wage = Math.round(ROLES[role].wage * (0.7 + 0.15 * skill) * rnd(0.92, 1.1));
  const tr = pick(TRAITS);
  return { id: nid(), role, name: `${pick(FIRST)} ${pick(LAST)}`, skill, wage, trait: tr[0], tk: tr[1], em: ROLES[role].icon };
}
function rollCandidates() {
  const roles = ROLE_ORDER.filter((r) => ROLES[r].star <= S.stars);
  S.candidates = [];
  // always one of the basics, then a mix
  ['receptionist', 'housekeeper', 'chef', 'waiter', 'maintenance'].forEach((r) => S.candidates.push(makeCandidate(r)));
  for (let i = 0; i < 2; i++) S.candidates.push(makeCandidate(pick(roles)));
}
function hire(c) {
  if (S.money < c.wage) { toast('💸', 'You need at least one day of wages to hire.', 'bad'); return; }
  if (c.role === 'therapist' && !S.fac.spa) { toast('💆', 'Build a Spa before hiring therapists.', 'bad'); return; }
  S.candidates = S.candidates.filter((x) => x !== c);
  S.staff.push({ id: c.id, role: c.role, name: c.name, skill: c.skill, wage: c.wage, trait: c.trait, tk: c.tk, em: c.em, morale: 75, energy: 100, job: null, rest: false, sick: false, hired: S.day, tired: false });
  beep('ding');
  toast(c.em, `${c.name} joined as ${ROLES[c.role].name}!`, 'good');
}
function fire(s) {
  cancelJob(s);
  spend(s.wage, 'wages');
  S.staff = S.staff.filter((x) => x !== s);
  toast('📦', `${s.name} has left (paid one day's notice).`);
}
function train(s) {
  if (s.skill >= 5) return;
  const cost = 250 * s.skill + 150;
  if (!pay(cost, 'other')) return;
  s.skill++; s.wage = Math.round(s.wage * 1.12); s.morale = clamp(s.morale + 10, 0, 100);
  beep('star');
  toast('🎓', `${s.name} trained up to skill ${s.skill}!`, 'good');
}
function raise(s) { s.wage = Math.round(s.wage * 1.1); s.morale = clamp(s.morale + 22, 0, 100); toast('💵', `${s.name.split(' ')[0]} is thrilled with the pay rise!`, 'good'); }
function cancelJob(s) {
  const j = s.job; if (!j) return;
  if (j.kind === 'clean') { const r = roomById(j.target); if (r && r.state === 'cleaning') { r.state = 'dirty'; r.job = null; } }
  if (j.kind === 'repair' || j.kind === 'polish') { const r = roomById(j.target); if (r) r.job = null; }
  if (j.kind === 'cook') { const o = S.orders.find((x) => x.id === j.target); if (o) { o.status = 'new'; o.by = null; } }
  if (j.kind === 'deliver') { const o = S.orders.find((x) => x.id === j.target); if (o) { o.status = 'ready'; o.by = null; } }
  if (j.kind === 'checkin' || j.kind === 'checkout') { const g = guestById(j.target); if (g) g.by = null; }
  if (j.kind === 'complaint') { const c = S.complaints.find((x) => x.id === j.target); if (c) c.by = null; }
  s.job = null;
}
function workSpeed(s) {
  let sp = speedFor(s.skill) * (0.7 + 0.3 * s.morale / 100);
  if (s.tk === 'speed') sp *= 1.15;
  return sp;
}
function findJob(s) {
  const tag = 's' + s.id;
  switch (s.role) {
    case 'receptionist': {
      const out = S.guests.find((g) => g.status === 'checkout' && !g.by);
      if (out) { out.by = tag; return { kind: 'checkout', target: out.id, t: 0, total: 12 }; }
      const q = S.guests.filter((g) => g.status === 'queue' && !g.by).sort((a, b) => (b.inspector - a.inspector) || (b.vip - a.vip) || a.arrived - b.arrived);
      if (q.length && freeRooms().length > S.guests.filter((g) => g.status === 'queue' && g.by).length) { q[0].by = tag; return { kind: 'checkin', target: q[0].id, t: 0, total: 14 }; }
      return null;
    }
    case 'housekeeper': {
      const r = S.rooms.find((x) => x.state === 'dirty' && !x.job);
      if (r) { r.state = 'cleaning'; r.job = tag; return { kind: 'clean', target: r.id, t: 0, total: 45 }; }
      return null;
    }
    case 'chef': {
      const o = S.orders.filter((x) => x.status === 'new').sort((a, b) => (b.critic - a.critic) || a.at - b.at)[0];
      if (o) { startCooking(o, tag); return { kind: 'cook', target: o.id, t: 0, total: cookTime(o, s.skill) * speedFor(s.skill) }; }
      return null;
    }
    case 'waiter': {
      const o = S.orders.filter((x) => x.status === 'ready').sort((a, b) => a.readyAt - b.readyAt)[0];
      if (o) { o.status = 'delivering'; o.by = tag; return { kind: 'deliver', target: o.id, t: 0, total: 10 }; }
      return null;
    }
    case 'maintenance': {
      const r = S.rooms.filter((x) => x.issue && !x.job).sort((a, b) => (!!b.guestId - !!a.guestId))[0];
      if (r) { r.job = tag; return { kind: 'repair', target: r.id, t: 0, total: 50 }; }
      const p = S.rooms.filter((x) => !x.job && x.condition < 92 && x.state !== 'cleaning').sort((a, b) => a.condition - b.condition)[0];
      if (p) { p.job = tag; return { kind: 'polish', target: p.id, t: 0, total: 40 }; }
      return null;
    }
    case 'concierge': {
      const c = S.complaints.find((x) => !x.by);
      if (c) { c.by = tag; return { kind: 'complaint', target: c.id, t: 0, total: 18 }; }
      return null;
    }
  }
  return null;
}
function finishJob(s) {
  const j = s.job; s.job = null;
  if (j.kind === 'checkin') { const g = guestById(j.target); if (g && g.status === 'queue') { const r = bestRoomFor(g); if (r) checkIn(g, r, s); else g.by = null; } }
  if (j.kind === 'checkout') { const g = guestById(j.target); if (g) checkOut(g, s); }
  if (j.kind === 'clean') { const r = roomById(j.target); if (r) finishClean(r, s.skill + (s.tk === 'quality' ? 1 : 0)); }
  if (j.kind === 'repair') { const r = roomById(j.target); if (r) { r.job = null; repairRoom(r); } }
  if (j.kind === 'polish') { const r = roomById(j.target); if (r) { r.job = null; r.condition = clamp(r.condition + 4 + s.skill, 0, 100); } }
  if (j.kind === 'cook') { const o = S.orders.find((x) => x.id === j.target); if (o) finishCooking(o, s.skill); }
  if (j.kind === 'deliver') { const o = S.orders.find((x) => x.id === j.target); if (o) deliverOrder(o); }
  if (j.kind === 'complaint') { const c = S.complaints.find((x) => x.id === j.target); if (c) { if (chance(0.5 + 0.1 * s.skill + (s.tk === 'charm' ? 0.1 : 0))) resolveComplaint(c, 'concierge', s); else { c.by = null; c.triedBy = true; const g = guestById(c.guestId); if (g) nudge(g, -2); } } }
}
function finishClean(r, quality) {
  r.state = 'clean'; r.job = null;
  if (quality >= 4) r.condition = clamp(r.condition + 2, 0, 100);
  sparkle(r.id, '✨');
  // a vacant room can turn out to be broken
  if (!r.issue && chance(0.04 * (1 + (100 - r.condition) / 40) * (effect('heatwave') ? 1.6 : 1))) { r.issue = pick(['ac', 'shower', 'tv', 'leak']); toast('🔧', `Housekeeping found a ${ISSUES[r.issue].label.toLowerCase()} in room ${r.label}.`, 'bad'); }
}
function staffMinute() {
  for (const s of S.staff) {
    if (s.sick) continue;
    if (s.role === 'therapist') { s.energy = clamp(s.energy + 0.05, 0, 100); continue; }
    if (s.rest) { s.energy += 0.4; if (s.energy >= 70) { s.rest = false; } continue; }
    if (!s.job) {
      s.energy = clamp(s.energy + 0.12, 0, 100);
      const h = hour();
      if (h >= 6 || s.role !== 'maintenance') s.job = findJob(s);
      continue;
    }
    s.job.t += workSpeed(s);
    s.energy -= s.tk === 'energy' ? 0.05 : 0.08;
    if (s.energy <= 8) { s.tired = true; }
    if (s.job.t >= s.job.total) finishJob(s);
    if (s.energy <= 8 && !s.job) { s.rest = true; }
  }
}

/* =====================================================================
   THE MANAGER (you!) can do one hands-on job at a time
   ===================================================================== */
const MGR_SPEED = 0.85;
function mgrStart(kind, target) {
  if (S.manager) { toast('👔', 'You are already busy. Finish or cancel your current job first.', 'bad'); return false; }
  if (kind === 'clean') { const r = roomById(target); if (!r || r.state !== 'dirty') return false; r.state = 'cleaning'; r.job = 'm'; S.manager = { kind, target, t: 0, total: 55, label: `Cleaning room ${r.label}` }; }
  if (kind === 'repair') { const r = roomById(target); if (!r || !r.issue || r.job) return false; r.job = 'm'; S.manager = { kind, target, t: 0, total: 70, label: `Fixing room ${r.label}` }; }
  if (kind === 'cook') { const o = S.orders.find((x) => x.id === target); if (!o || o.status !== 'new') return false; startCooking(o, 'm'); S.manager = { kind, target, t: 0, total: cookTime(o, 3) * 1.1, label: `Cooking ${MENU.find((d) => d.id === o.dish).name}` }; }
  if (kind === 'deliver') { const o = S.orders.find((x) => x.id === target); if (!o || o.status !== 'ready') return false; o.status = 'delivering'; o.by = 'm'; S.manager = { kind, target, t: 0, total: 12, label: `Delivering ${MENU.find((d) => d.id === o.dish).name}` }; }
  beep('click');
  return true;
}
function mgrCancel() {
  const m = S.manager; if (!m) return;
  if (m.kind === 'clean') { const r = roomById(m.target); if (r && r.state === 'cleaning') { r.state = 'dirty'; r.job = null; } }
  if (m.kind === 'repair') { const r = roomById(m.target); if (r) r.job = null; }
  if (m.kind === 'cook') { const o = S.orders.find((x) => x.id === m.target); if (o) { o.status = 'new'; o.by = null; } }
  if (m.kind === 'deliver') { const o = S.orders.find((x) => x.id === m.target); if (o) { o.status = 'ready'; o.by = null; } }
  S.manager = null;
}
function mgrMinute() {
  const m = S.manager; if (!m) return;
  m.t += MGR_SPEED;
  if (m.t < m.total) return;
  S.manager = null;
  if (m.kind === 'clean') { const r = roomById(m.target); if (r) finishClean(r, 3); }
  if (m.kind === 'repair') { const r = roomById(m.target); if (r) { r.job = null; repairRoom(r); } }
  if (m.kind === 'cook') { const o = S.orders.find((x) => x.id === m.target); if (o) finishCooking(o, 3); }
  if (m.kind === 'deliver') { const o = S.orders.find((x) => x.id === m.target); if (o) deliverOrder(o); }
}
function callContractor(room) {
  if (!room.issue || room.job) return;
  if (!pay(220, 'repairs')) return;
  room.job = 'c';
  S.effects.push({ key: 'contractor', room: room.id, at: abs() + 30, days: 99 });
  toast('🚐', `A repair company is on the way to room ${room.label} (30 min).`);
}

/* =====================================================================
   MONEY
   ===================================================================== */
function spend(n, kind) { S.money -= n; S.today.exp[kind] = (S.today.exp[kind] || 0) + n; }
function pay(n, kind, capex) {
  if (S.money < n) { toast('💸', `Not enough money. You need ${money(n)}.`, 'bad'); beep('bad'); return false; }
  S.money -= n;
  if (capex) S.today.capex += n; else S.today.exp[kind] = (S.today.exp[kind] || 0) + n;
  beep('cash');
  return true;
}
function payBill(b) {
  if (b.paid) return;
  if (S.money < b.amount) { toast('💸', `Not enough money to pay ${b.name}.`, 'bad'); return; }
  S.money -= b.amount; S.today.exp.bills += b.amount; b.paid = true;
  toast('🧾', `Paid ${b.name}: ${money(b.amount)}.`, 'good'); beep('cash');
  S.bills = S.bills.filter((x) => !x.paid);
}
function issueBills() {
  const d = S.day, n = S.rooms.length, facLv = FAC_ORDER.reduce((a, k) => a + S.fac[k], 0);
  const add = (name, icon, amount) => S.bills.push({ id: nid(), name, icon, amount: Math.round(amount), issued: d, due: d + 3, paid: false, late: 0 });
  if (d % 3 === 0) add('Electricity', '⚡', 120 + n * 13 + facLv * 45 + (effect('heatwave') ? 150 : 0));
  if (d % 3 === 1) add('Water', '🚰', 60 + n * 8 + (S.fac.pool ? 120 * S.fac.pool : 0) + (S.fac.spa ? 90 : 0));
  if (d % 2 === 0) add('Laundry service', '🧺', 40 + (S.today.guests + S.guests.filter((g) => g.status === 'staying').length) * 7);
  if (d % 7 === 0) add('Property tax', '🏛️', 300 + n * 40 + facLv * 120);
  if (S.autopay) for (const b of S.bills.slice()) if (S.money >= b.amount) payBill(b);
}
function hotelValue() { return S.rooms.reduce((a, r) => a + 2500 + ROOM_TYPES[r.type].cost + (r.decor - 1) * 800, 0) + FAC_ORDER.reduce((a, k) => a + FAC[k].cost.slice(0, S.fac[k]).reduce((x, y) => x + y, 0), 0); }
function loanLimit() { return 10000 * S.stars + 5000; }

/* =====================================================================
   BUILDING & UPGRADES
   ===================================================================== */
function buildFloor() {
  if (S.floors >= maxFloors()) { toast('🏗️', `Reach more stars to build higher (max ${maxFloors()} floors now).`, 'bad'); return; }
  if (!pay(floorCost(), 'other', true)) return;
  const f = S.floors++;
  for (let i = 0; i < ROOMS_PER_FLOOR; i++) { const r = addRoom(f, i); r.condition = 100; }
  toast('🏗️', `Floor ${f + 1} is open with 5 brand new rooms!`, 'good');
  beep('star');
  layoutChanged = true;
}
function upgradeRoom(r) {
  const next = TYPE_ORDER[TYPE_ORDER.indexOf(r.type) + 1];
  if (!next) return;
  if (S.stars < ROOM_TYPES[next].star) { toast('⭐', `${ROOM_TYPES[next].name}s need a ${ROOM_TYPES[next].star}-star hotel.`, 'bad'); return; }
  if (r.guestId || r.state === 'cleaning') { toast('🛏️', 'Wait until the room is empty and not being cleaned.', 'bad'); return; }
  if (!pay(ROOM_TYPES[next].cost, 'other', true)) return;
  r.type = next; r.condition = 100; r.decor = 1; r.state = 'clean';
  sparkle(r.id, '🌟');
  toast(ROOM_TYPES[next].icon, `Room ${r.label} is now a ${ROOM_TYPES[next].name}!`, 'good');
}
function refurbCost(r) { return Math.round(ROOM_TYPES[r.type].base * 6 * r.decor / 10) * 10; }
function refurbish(r) {
  if (r.decor >= 3) return;
  if (r.guestId || r.state === 'cleaning') { toast('🛏️', 'Wait until the room is empty and not being cleaned.', 'bad'); return; }
  if (!pay(refurbCost(r), 'other', true)) return;
  r.decor++; r.condition = 100;
  sparkle(r.id, '🎨');
  toast('🎨', `Room ${r.label} has new decor (level ${r.decor}).`, 'good');
}
function facNextCost(k) { return FAC[k].cost[S.fac[k]]; }
function buildFac(k) {
  const lv = S.fac[k]; if (lv >= 3) return;
  const need = FAC[k].star[lv];
  if (S.stars < need) { toast('⭐', `Needs a ${need}-star hotel.`, 'bad'); return; }
  if (!pay(FAC[k].cost[lv], 'other', true)) return;
  S.fac[k]++;
  beep('star');
  toast(FAC[k].icon, lv === 0 ? `Your ${FAC[k].name} is open!` : `${FAC[k].name} upgraded to level ${S.fac[k]}!`, 'good');
  layoutChanged = true;
}
function startMarketing(m) {
  if (S.marketing.some((x) => x.id === m.id)) return;
  if (S.stars < m.star) { toast('⭐', `Needs a ${m.star}-star hotel.`, 'bad'); return; }
  if (S.money < m.cost) { toast('💸', `Not enough money. You need ${money(m.cost)}.`, 'bad'); return; }
  spend(m.cost, 'marketing');
  S.marketing.push({ id: m.id, days: m.days });
  beep('cash');
  toast(m.icon, `${m.name} running for ${plural(m.days, 'day')}. More guests are coming!`, 'good');
}

/* =====================================================================
   STARS & INSPECTION
   ===================================================================== */
function reqStatus(star) {
  const q = STAR_REQ[star]; if (!q) return null;
  const count = (t) => S.rooms.filter((r) => TYPE_ORDER.indexOf(r.type) >= TYPE_ORDER.indexOf(t)).length;
  const list = [
    [`Guest rating ${q.rating.toFixed(1)}+`, S.rating >= q.rating, S.rating.toFixed(2)],
    [`${q.guests} guests served`, S.guestsServed >= q.guests, S.guestsServed],
    [`${q.rooms}+ rooms`, S.rooms.length >= q.rooms, S.rooms.length],
    [`${q.staff}+ staff`, S.staff.length >= q.staff, S.staff.length],
  ];
  if (q.deluxe) list.push([`${q.deluxe} Deluxe or better rooms`, count('deluxe') >= q.deluxe, count('deluxe')]);
  if (q.suite) list.push([`${q.suite} Suites`, count('suite') >= q.suite, count('suite')]);
  for (const [k, lv] of Object.entries(q.fac)) list.push([`${FAC[k].name}${lv > 1 ? ' level ' + lv : ''}`, S.fac[k] >= lv, 'Lv ' + S.fac[k]]);
  return { list, ok: list.every((x) => x[1]) };
}
function requestInspection() {
  const st = reqStatus(S.stars + 1);
  if (!st || !st.ok || S.inspection) return;
  if (!pay(INSPECTION_FEE, 'other')) return;
  S.inspection = { day: S.day, star: S.stars + 1 };
  const g = makeGuest('business', { inspector: true, name: `Inspector ${pick(LAST)}`, em: '🧐', nights: 1 });
  g.want = typesInHotel().slice(-1)[0];
  arrive(g);
  setTab('desk');
}
function finishInspection(g, rv) {
  const target = S.inspection ? S.inspection.star : S.stars + 1;
  S.inspection = null;
  if (rv.stars >= 4) {
    S.stars = Math.max(S.stars, target);
    beep('star'); confetti();
    const unlocks = [];
    for (const k of FAC_ORDER) FAC[k].star.forEach((s, i) => { if (s === S.stars) unlocks.push(`${FAC[k].icon} ${FAC[k].name}${i ? ' level ' + (i + 1) : ''}`); });
    for (const t of TYPE_ORDER) if (ROOM_TYPES[t].star === S.stars) unlocks.push(`${ROOM_TYPES[t].icon} ${ROOM_TYPES[t].name} rooms`);
    for (const r of ROLE_ORDER) if (ROLES[r].star === S.stars) unlocks.push(`${ROLES[r].icon} ${ROLES[r].name}s`);
    for (const m of MARKETING) if (m.star === S.stars) unlocks.push(`${m.icon} ${m.name}`);
    unlocks.push(`🏗️ Build up to ${maxFloors()} floors`);
    const win = S.stars >= 5 && !S.won;
    if (win) S.won = true;
    showModal({ icon: '⭐', title: win ? 'FIVE STARS! You did it!' : `${S.name} is now a ${S.stars}-star hotel!`, body: `<p>The inspector gave you <b>${'★'.repeat(rv.stars)}</b>. “${esc(rv.text)}”</p>${win ? '<p><b>Your hotel is one of the finest in the world.</b> Keep running it as long as you like!</p>' : ''}<p><b>Unlocked:</b></p><ul class="help">${unlocks.map((u) => `<li>${u}</li>`).join('')}</ul><p class="note">Guests now pay more, but they also expect more.</p>`, acts: [['Fantastic!', 'gold', closeModal]] });
  } else {
    showModal({ icon: '🧐', title: 'Inspection failed', body: `<p>The inspector only gave you <b>${'★'.repeat(rv.stars)}</b>. “${esc(rv.text)}”</p><p>Tips: give them your best clean room, check them in fast, fix broken things and keep the restaurant quick. You can try again any time.</p>`, acts: [['OK', 'gold', closeModal]] });
  }
}

/* =====================================================================
   SIMULATION: one game minute

let layoutChanged = true;
function stepMinute() {
  S.minute++;

  const m = S.minute, h = hour(), now = abs();
  spawnArrivals();

  // guests
  for (const g of S.guests.slice()) {
    if (g.status === 'queue') {
      if (now - g.arrived > g.patience && !g.by) guestLeaves(g, 'gave up waiting and left.');
      else if ((now - g.arrived) % 15 === 0 && now - g.arrived > 30) nudge(g, -1);
    } else if (g.status === 'staying') {
      if (S.day === g.checkoutDay && m >= g.leaveMin) { g.status = 'checkout'; g.checkoutAt = now; }
      else if (S.day > g.checkoutDay) { g.status = 'checkout'; g.checkoutAt = now; }
    } else if (g.status === 'checkout') {
      const w = now - g.checkoutAt;
      if (w > 0 && w % 20 === 0 && w > 30) nudge(g, -2);
      if (w > 150 && !g.by) { addNote(g, 'lateOut'); checkOut(g); }
    }
  }
  // orders go stale
  for (const o of S.orders.slice()) {
    const age = now - o.at;
    if ((o.status === 'new' && age > 80) || (o.status === 'ready' && now - o.readyAt > 60)) {
      S.orders = S.orders.filter((x) => x !== o);
      const g = guestById(o.guestId);
      if (g) { addNote(g, 'slowFood'); if (chance(0.35)) addComplaint(g, 'cold'); }
      if (o.critic) pushReview({ id: nid(), name: 'City Food Guide', em: '📝', day: S.day, stars: 1, title: 'Still waiting...', text: 'Our order never arrived. Avoid the restaurant.', kind: 'critic', critic: true });
      toast('🍽️', 'An order was cancelled because it took too long.', 'bad');
    }
  }
  // complaints time out
  for (const c of S.complaints.slice()) {
    if (now - c.at > c.limit && !c.by) {
      S.complaints = S.complaints.filter((x) => x !== c);
      const g = guestById(c.guestId);
      if (g) { addNote(g, 'ignored'); nudge(g, -6); }
      toast('😡', `Nobody answered the "${c.label}" complaint.`, 'bad');

  }
  // contractor repairs

    if (now >= e.at) { const r = roomById(e.room); if (r) { r.job = null; repairRoom(r); } S.effects = S.effects.filter((x) => x !== e); }

}
function hourly(h) {
  const staying = S.guests.filter((g) => g.status === 'staying');
  const meal = (h >= 7 && h < 10) || (h >= 12 && h < 14) || (h >= 18 && h < 21);
  const concierges = staffOf('concierge').length;
  const therapists = staffOf('therapist').length;
  let spaUsed = 0;
  for (const g of staying) {
    const k = KINDS[g.kind], room = roomById(g.roomId);
    // food
    let p = meal ? 0.2 : (h >= 22 || h < 7 ? 0.01 : 0.035);
    if (k.likes.includes('restaurant')) p *= 1.3;
    if (S.orders.filter((o) => o.guestId === g.id).length === 0 && chance(p * k.spend)) addOrder(g);
    // facilities
    if (h >= 7 && h < 23) {
      for (const f of ['gym', 'pool', 'bar', 'spa']) {
        const lv = S.fac[f]; if (!lv) continue;
        if (f === 'bar' && h < 16) continue;
        if (f === 'spa' && spaUsed >= therapists * 2) continue;
        let q = 0.035 * (k.likes.includes(f) ? 2.2 : 1) * (1 + 0.25 * (lv - 1));
        if (f === 'pool' && effect('heatwave')) q *= 2;
        if (f === 'pool' && (h < 9 || h > 20)) q *= 0.3;
        if (g.used[f] >= 2) q *= 0.3;
        if (chance(q)) {
          if (f === 'spa') spaUsed++;
          const fee = Math.round(FAC[f].fee * (1 + 0.3 * (lv - 1)) * clamp(g.budget, 0.6, 2.5));
          g.bill.push({ label: `${FAC[f].name} visit`, amount: fee, kind: 'facilities' });
          g.used[f] = (g.used[f] || 0) + 1;
          nudge(g, FAC[f].mood * (0.8 + 0.2 * lv));
          if (k.likes.includes(f)) addNote(g, f);
          activity[f] = (activity[f] || 0) + 1;
        }
      }
    }
    // breakdowns and other gripes
    if (room) {
      const heat = effect('heatwave') ? 1.8 : 1;
      if (!room.issue && chance(0.005 * (1 + (100 - room.condition) / 35) * heat)) breakRoom(room, pick(heat > 1 ? ['ac', 'ac', 'shower', 'tv'] : ['ac', 'shower', 'tv', 'tv']));
      if (room.issue) nudge(g, -3);
      if (room.condition < 45 && chance(0.03)) addComplaint(g, 'dusty');
    }
    if (h >= 21 || h < 2) { if (chance(0.012 * (staying.length / Math.max(1, S.rooms.length)) * 3)) { addNote(g, 'noise'); addComplaint(g, 'noise'); } }
    if (chance(0.004)) addComplaint(g, 'wifi');
    if (concierges) nudge(g, Math.min(2, concierges * 0.7));
  }
  // conference bookings
  if (h === 9 && S.fac.conference) {
    if (chance(0.35 + 0.15 * S.fac.conference)) { const fee = 700 * S.fac.conference + 150 * S.stars; S.money += fee; S.today.rev.facilities += fee; toast('🎤', `A company booked the conference hall today: +${money(fee)}`, 'good'); beep('cash'); activity.conference = 4; }
  }
  if (h === 19) { const w = effect('wedding'); if (w && w.ready) { S.money += w.fee; S.today.rev.food += w.fee; S.effects = S.effects.filter((x) => x !== w); toast('💒', `The wedding dinner was a hit! +${money(w.fee)}`, 'good'); beep('cash'); } }

}
const activity = {};

/* =====================================================================
   END OF DAY

function endOfDay() {
  const t = S.today;
  // wages
  const wages = S.staff.reduce((a, s) => a + s.wage, 0);
  spend(wages, 'wages');
  // upkeep for facilities
  const upkeep = FAC_ORDER.reduce((a, k) => a + (S.fac[k] ? FAC[k].upkeep * S.fac[k] : 0), 0) + S.rooms.length * 6;
  spend(upkeep, 'upkeep');
  // loan interest
  if (S.loan > 0) { const i = Math.round(S.loan * 0.01); spend(i, 'interest'); }
  // bills: overdue fees
  for (const b of S.bills) if (S.day > b.due) { b.late++; const fee = Math.round(b.amount * 0.1); b.amount += fee; }
  const overdue = S.bills.filter((b) => S.day > b.due + 2);
  if (overdue.length) S.guests.filter((g) => g.status === 'staying').forEach((g) => nudge(g, -6));
  // staff morale
  const quits = [];
  for (const s of S.staff) {
    s.sick = false; s.rest = false;
    if (s.tired) s.morale -= 8; s.tired = false;
    s.morale += (72 - s.morale) * 0.1 + (s.tk === 'morale' ? 3 : 0);
    if (S.money < 0) s.morale -= 12;
    s.morale = clamp(s.morale, 0, 100);
    s.energy = 100;
    if (s.morale < 25 && chance(0.35)) quits.push(s);
  }
  quits.forEach((s) => { cancelJob(s); S.staff = S.staff.filter((x) => x !== s); });
  // effects tick
  S.effects.forEach((e) => { if (e.key !== 'contractor') e.days--; });
  const wed = S.effects.find((e) => e.key === 'wedding'); if (wed) wed.ready = true;
  S.effects = S.effects.filter((e) => e.key === 'contractor' || e.days > 0 || e.key === 'wedding' && e.ready && e.days >= 0);
  S.marketing.forEach((m) => m.days--); S.marketing = S.marketing.filter((m) => m.days > 0);

  if (S.money < 0) S.debtDays++; else S.debtDays = 0;

  autosave();

}

function barValue(key) {
  const [k, id] = key.split(':'); const n = +id;
  const now = abs();
  if (k === 'room') { const r = roomById(n); if (!r) return 0; const s = r.job && r.job !== 'm' && r.job !== 'c' ? staffById(+String(r.job).slice(1)) : null; const j = r.job === 'm' ? S.manager : s ? s.job : null; if (r.job === 'c') { const e = S.effects.find((x) => x.key === 'contractor' && x.room === r.id); return e ? 1 - (e.at - now) / 30 : 0; } return j && j.target === r.id ? j.t / j.total : 0; }
  if (k === 'pat' || k === 'patw') { const g = guestById(n); return g ? clamp(1 - (now - g.arrived) / g.patience, 0, 1) : 0; }
  if (k === 'outw') { const g = guestById(n); return g ? clamp(1 - (now - g.checkoutAt) / 150, 0, 1) : 0; }
  if (k === 'comp') { const c = S.complaints.find((x) => x.id === n); return c ? clamp(1 - (now - c.at) / c.limit, 0, 1) : 0; }
  if (k === 'ord') { const o = S.orders.find((x) => x.id === n); if (!o) return 0; const j = o.by === 'm' ? S.manager : (S.staff.find((s) => s.job && s.job.kind === 'cook' && s.job.target === o.id) || {}).job; return j ? j.t / j.total : 0; }
  if (k === 'ordw') { const o = S.orders.find((x) => x.id === n); if (!o) return 0; return o.status === 'ready' ? clamp(1 - (now - o.readyAt) / 60, 0, 1) : clamp(1 - (now - o.at) / 80, 0, 1); }
  if (k === 'energy') { const s = staffById(n); return s ? s.energy / 100 : 0; }
  if (k === 'mgr') return S.manager ? S.manager.t / S.manager.total : 0;
  return 0;
}
function updateBars() {
  document.querySelectorAll('[data-bar]').forEach((el) => {
    const v = clamp(barValue(el.dataset.bar), 0, 1);
    el.style.width = Math.round(v * 100) + '%';
    if (el.dataset.bar.startsWith('pat:')) el.style.background = v > 0.5 ? '#2f8f5b' : v > 0.25 ? '#d98c1f' : '#c0392b';
  });
}

function handleAction(e) {

  if (!el || el.disabled || !S) return;
  const act = el.dataset.act, id = +el.dataset.id;
  const g = guestById(id), r = roomById(id);
  switch (act) {
    case 'tab': setTab(el.dataset.tab); beep('click'); break;
    case 'tipoff': S.tips.first = false; break;
    case 'help': showHelp(); break;
    case 'checkin': if (g) { const best = bestRoomFor(g); if (best) checkIn(g, best); else toast('🛏️', 'No clean room is free. Clean a room first!', 'bad'); } break;
    case 'choose': if (g) chooseRoom(g); break;
    case 'assign': { const gg = guestById(+el.dataset.g), rr = roomById(+el.dataset.r); if (gg && rr && checkIn(gg, rr)) closeModal(); break; }
    case 'turnaway': if (g) { S.guests = S.guests.filter((x) => x !== g); if (g.inspector) S.inspection = null; toast('🚪', `You turned ${g.name} away.`); } break;
    case 'guest': if (g) chooseRoom(g); break;
    case 'checkout': if (g && !g.by) checkOut(g); break;
    case 'room': ui.selRoom = id; roomDialog(r); break;
    case 'mclean': if (r && mgrStart('clean', id) && ui.modal) closeModal(); break;
    case 'mrepair': if (r && mgrStart('repair', id) && ui.modal) closeModal(); break;
    case 'contractor': if (r) { callContractor(r); if (ui.modal) closeModal(); } break;
    case 'mcook': mgrStart('cook', id); break;
    case 'mdeliver': mgrStart('deliver', id); break;
    case 'mcancel': mgrCancel(); break;
    case 'comp': { const c = S.complaints.find((x) => x.id === id); if (c) resolveComplaint(c, el.dataset.how); break; }
    case 'price': { const t = el.dataset.t; S.prices[t] = clamp(S.prices[t] + +el.dataset.d, 20, 5000); beep('click'); break; }
    case 'uproom': if (r) { upgradeRoom(r); if (ui.modal) roomDialog(r); } break;
    case 'refurb': if (r) { refurbish(r); if (ui.modal) roomDialog(r); } break;
    case 'floor': buildFloor(); break;
    case 'hire': { const c = S.candidates.find((x) => x.id === id); if (c) hire(c); break; }
    case 'fire': { const s = staffById(id); if (s) choice('📦', `Let ${esc(s.name)} go?`, `They will get one day's pay (${money(s.wage)}) as notice.`, [['Let them go', 'red', () => fire(s)], ['Keep them', 'gold', () => {}]]); break; }
    case 'train': { const s = staffById(id); if (s) train(s); break; }

    case 'reroll': if (pay(150, 'other')) { rollCandidates(); toast('📢', 'New applicants are waiting!', 'good'); } break;
    case 'menu': { const d = el.dataset.id; if (el.checked) S.menuOff = S.menuOff.filter((x) => x !== d); else if (menuNow().length > 1) S.menuOff.push(d); else { el.checked = true; toast('🍽️', 'Keep at least one dish on the menu.', 'bad'); } panelCache = ''; break; }
    case 'buildfac': buildFac(el.dataset.k); if (ui.modal && ui.modal.fac) facDialog(el.dataset.k); break;
    case 'facinfo': facDialog(el.dataset.k); break;
    case 'autopay': S.autopay = el.checked; if (S.autopay) for (const b of S.bills.slice()) if (S.money >= b.amount) payBill(b); break;
    case 'paybill': { const b = S.bills.find((x) => x.id === id); if (b) payBill(b); break; }
    case 'borrow': { const n = +el.dataset.n; if (S.loan + n <= loanLimit()) { S.loan += n; S.money += n; beep('cash'); toast('🏦', `The bank lent you ${money(n)}.`, 'good'); } break; }
    case 'repay': { const n = el.dataset.n === 'all' ? S.loan : Math.min(1000, S.loan); if (S.money >= n && n > 0) { S.money -= n; S.loan -= n; beep('cash'); toast('🏦', `Repaid ${money(n)}.`, 'good'); } break; }
    case 'market': { const m = MARKETING.find((x) => x.id === el.dataset.id); if (m) startMarketing(m); break; }
    case 'inspect': requestInspection(); break;
  }
  panelCache = ''; sceneHTMLCache = ''; tabsCache = '';
}
document.addEventListener('click', (e) => { if (e.target.closest('#modal')) return; handleAction(e); });
document.addEventListener('change', (e) => { if (e.target.matches('input[type=checkbox][data-act]')) { /* handled by click */ } });
document.addEventListener('pointerdown', (e) => { if (e.target.closest('#panelBody, #world, #tabs, #modal')) ui.pointer = true; }, true);
document.addEventListener('pointerup', () => { setTimeout(() => { ui.pointer = false; }, 0); }, true);
document.addEventListener('pointercancel', () => { ui.pointer = false; }, true);

function chooseRoom(g) {
  const free = freeRooms().sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) || b.condition - a.condition);
  const wi = TYPE_ORDER.indexOf(g.want);
  const body = `<div class="row" style="margin-bottom:10px"><div class="av${g.vip || g.inspector ? ' vip' : ''}">${g.em}</div><div class="grow"><div class="t1">${esc(g.name)}</div><div class="t2">${g.inspector ? 'Hotel star inspector' : KINDS[g.kind].label} · wants <b>${ROOM_TYPES[g.want].name}</b> · ${plural(g.nights, 'night')} · likes ${KINDS[g.kind].likes.map((f) => FAC[f].icon).join(' ')}</div></div></div>
    ${free.length ? free.map((r) => { const ti = TYPE_ORDER.indexOf(r.type); const tag = ti === wi ? '<span class="tag green">Perfect match</span>' : ti > wi ? '<span class="tag gold">Free upgrade: happier guest</span>' : '<span class="tag red">Downgrade: unhappy, pays less</span>'; return `<div class="slot"><div class="av">${ROOM_TYPES[r.type].icon}</div><div class="grow"><div class="t1">Room ${r.label} · ${ROOM_TYPES[r.type].name} <span class="lvl">${starStr(r.decor, 3)}</span></div><div class="t2">Condition ${Math.round(r.condition)}% ${tag}</div></div><button class="b gold" data-act="assign" data-g="${g.id}" data-r="${r.id}">Give room</button></div>`; }).join('') : '<div class="empty">No clean rooms are free. Clean a dirty room or wait for a guest to leave.</div>'}`;
  showModal({ title: 'Choose a room', body, acts: [['Close', 'ghost', closeModal]] });
  ui.modal.dismiss = true;
}
function roomDialog(r) {
  if (!r) return;
  showModal({ title: `Room ${r.label}`, body: roomCard(r, true), acts: [['Close', 'ghost', () => { ui.selRoom = null; closeModal(); }]], onClose: () => { ui.selRoom = null; } });
  ui.modal.dismiss = true; ui.modal.room = r.id;
}
function facDialog(k) {
  const f = FAC[k], lv = S.fac[k], need = f.star[lv];
  const body = `<p>${f.desc}</p><div class="kv"><span>Level</span><span class="v lvl">${starStr(lv, 3)}</span><span>Upkeep</span><span class="v">${money(f.upkeep * Math.max(1, lv))}/day</span>${f.fee ? `<span>Guest pays per visit</span><span class="v">about ${money(f.fee * (1 + 0.3 * Math.max(0, lv - 1)))}</span>` : ''}<span>Guests who love it</span><span class="v em">${Object.values(KINDS).filter((x) => x.likes.includes(k)).map((x) => x.em[0]).join(' ') || '–'}</span></div>
    ${lv >= 3 ? '<p><b>Max level reached.</b></p>' : `<p>${lv ? 'Upgrade' : 'Build'} cost: <b>${money(f.cost[lv])}</b>${S.stars < need ? ` · <b class="neg">needs a ${need}★ hotel</b>` : ''}</p>`}`;
  const acts = [];
  if (lv < 3) acts.push([`${lv ? 'Upgrade' : 'Build'} ${money(f.cost[lv])}`, 'gold', () => { buildFac(k); closeModal(); }]);
  acts.push(['Close', 'ghost', closeModal]);
  showModal({ icon: f.icon, title: f.name, body, acts });
  ui.modal.dismiss = true; ui.modal.fac = k;
  if (lv < 3 && (S.stars < need || S.money < f.cost[lv])) { const b = $('#modal [data-mact="0"]'); if (b) b.disabled = true; }
}
function showHelp() {
  showModal({ icon: '🛎️', title: 'How to play', body: `<ul class="help">
    <li><b>Check in guests</b> at the Desk. Give them the room type they want (or a free upgrade!). They pay their whole bill when they check out.</li>
    <li><b>Clean rooms</b> after guests leave. Tap a dirty room 🧺 to clean it yourself, or hire Housekeepers.</li>
    <li><b>You can do one job at a time</b> (cleaning, fixing, cooking or serving). Hire staff so the hotel runs itself.</li>
    <li><b>Restaurant orders</b> come in at meal times. Cook and serve them quickly. Chefs and Waiters do it for you.</li>
    <li><b>Complaints</b>: fix broken things fast, apologise, send a treat or give a discount. Concierges help.</li>
    <li><b>Reviews</b> come from happy (or grumpy) guests and set your rating. A higher rating brings more guests.</li>
    <li><b>Money</b>: wages and upkeep are paid each night. Pay your bills before they are overdue. Take a loan if you need it, but don't stay in debt for 3 days!</li>
    <li><b>Grow</b>: upgrade rooms, build floors and add a gym, pool, bar, spa and more.</li>
    <li><b>Stars</b>: meet the goals in the Reviews tab, then request an inspection. Impress the inspector to earn your next star. Can you reach ★★★★★?</li>
    <li><b>Controls</b>: Space pauses, 1 / 2 / 3 change speed. Your game autosaves every night.</li></ul>`, acts: [["Let's go!", 'gold', closeModal]] });
  ui.modal.dismiss = true;
}
function showMenu(sub) {
  if (!sub) ui.resumeTo = S.paused;
  S.paused = true;
  showModal({ icon: '🏨', title: esc(S.name), body: `<p class="t2">Day ${S.day} · ${clock(S.minute)} · ${starStr(S.stars)} · ${money(S.money)}</p>`, acts: [
    ['▶ Resume', 'gold', () => { closeModal(); }],
    ['💾 Save game', 'ghost', () => slotsDialog('save')],
    ['📂 Load game', 'ghost', () => slotsDialog('load')],
    ['❓ How to play', 'ghost', showHelp],
    [ui.sound ? '🔊 Sound: on' : '🔇 Sound: off', 'ghost', () => { ui.sound = !ui.sound; store.set('hh-sound', ui.sound ? '1' : '0'); showMenu(true); }],
    ['🚪 Quit to title', 'red', () => { autosave(); closeModal(); toTitle(); }],
  ], onClose: () => { if (S) S.paused = !!ui.resumeTo; } });
  ui.modal.dismiss = true;
}
function slotsDialog(mode) {
  const keys = mode === 'save' ? SLOTS : ['hh-auto', ...SLOTS];
  const body = keys.map((k, i) => { const d = readSlot(k); const name = k === 'hh-auto' ? 'Autosave' : 'Slot ' + (SLOTS.indexOf(k) + 1); return `<div class="slot"><div class="grow"><div class="t2"><b>${name}</b></div>${slotLabel(d)}</div><button class="b ${mode === 'save' ? 'gold' : d ? 'gold' : 'ghost'}" data-mact="${i}"${mode === 'load' && !d ? ' disabled' : ''}>${mode === 'save' ? (d ? 'Overwrite' : 'Save') : 'Load'}</button></div>`; }).join('');
  const back = () => { if (S && !$('#title').hidden) closeModal(); else if (S && $('#title').hidden) showMenu(true); else closeModal(); };
  const acts = keys.map((k) => ['', '', () => { if (mode === 'save') { saveTo(k); slotsDialog('save'); } else if (loadFrom(k)) closeModal(); }]);
  acts.push(['Back', 'ghost', back]);
  ui.modal = null;
  modalActs = acts;
  $('#modal').innerHTML = `<div class="mi">${mode === 'save' ? '💾' : '📂'}</div><h2>${mode === 'save' ? 'Save game' : 'Load game'}</h2>${body}<div class="acts"><button class="b ghost" data-mact="${acts.length - 1}">Back</button></div>`;
  $('#modalBg').hidden = false;
  ui.modal = { dismiss: true, onClose: null };
}

/* =====================================================================
   TITLE SCREEN
   ===================================================================== */
function renderTitle() {
  const auto = readSlot('hh-auto'), anySave = auto || SLOTS.some((k) => readSlot(k));
  $('#tmenu').innerHTML = `${auto ? `<button class="b gold" id="tContinue">▶ Continue: ${esc(auto.meta.name)} (day ${auto.meta.day})</button>` : ''}
    <button class="b ${auto ? 'ghost' : 'gold'}" id="tNew">🏨 New hotel</button>
    ${anySave ? '<button class="b ghost" id="tLoad">📂 Load game</button>' : ''}
    <button class="b ghost" id="tHelp">❓ How to play</button>`;
  const c = $('#tContinue'); if (c) c.onclick = () => { loadFrom('hh-auto'); };
  $('#tNew').onclick = newDialog;
  const l = $('#tLoad'); if (l) l.onclick = () => slotsDialog('load');
  $('#tHelp').onclick = showHelp;
}
function newDialog() {
  showModal({ icon: '🏨', title: 'Name your hotel', body: `<p>You start with a small 10-room hotel, a little restaurant and ${money(6000)}. Make it legendary!</p><input class="input" id="hotelName" maxlength="28" value="The Grand Isla" aria-label="Hotel name">`, acts: [['Open the doors!', 'gold', () => { const n = ($('#hotelName').value || '').trim() || 'The Grand Isla'; closeModal(); newGame(n); hideTitle(); layoutChanged = true; setTimeout(showHelp, 300); }], ['Back', 'ghost', closeModal]] });
  ui.modal.dismiss = true;
  const inp = $('#hotelName'); inp.focus(); inp.select();
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') modalActs[0][2](); });
}
function hideTitle() { $('#title').hidden = true; ui.title = false; layoutChanged = true; panelCache = ''; tabsCache = ''; sceneHTMLCache = ''; }
function toTitle() { $('#title').hidden = false; ui.title = true; S && autosave(); renderTitle(); }

/* =====================================================================
   INPUT & MAIN LOOP
   ===================================================================== */
$('#pauseBtn').addEventListener('click', () => { if (S) { S.paused = !S.paused; beep('click'); } });
document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => { if (S) { S.speed = +b.dataset.speed; S.paused = false; beep('click'); } }));
$('#menuBtn').addEventListener('click', () => { if (S && !ui.modal) showMenu(); });
document.addEventListener('keydown', (e) => {
  if (!S || ui.title || e.target.matches('input')) return;
  if (e.key === 'Escape') { if (ui.modal && ui.modal.dismiss) closeModal(); else if (!ui.modal) showMenu(); return; }
  if (ui.modal) return;
  if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; }
  if (e.key === '1') S.speed = 1;
  if (e.key === '2') S.speed = 2;
  if (e.key === '3') S.speed = 4;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !ui.title) { S.paused = true; autosave(); } });
window.addEventListener('pagehide', () => { if (S && !ui.title) autosave(); });

let last = performance.now(), acc = 0, lastUI = 0;
function running() { return S && !ui.title && !S.paused && !ui.modal; }
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (running()) {
    const night = S.minute >= 22 * 60 || S.minute < 6 * 60;
    acc += dt * MIN_PER_SEC * S.speed * (night ? 3 : 1);
    let steps = 0;
    while (acc >= 1 && steps < 60) { acc -= 1; steps++; stepMinute(); if (!running()) { acc = 0; break; } }
  } else acc = 0;
  if (S && !ui.title && now - lastUI > 120) {
    lastUI = now;
    try { renderHUD(); renderScene(); renderTabs(); renderPanel(); } catch (err) { console.error(err); }
    if (ui.modal && ui.modal.room && !ui.pointer) { const r = roomById(ui.modal.room); const card = $('#modal [data-roomcard]'); if (r && card) { const tmp = roomCard(r, true); if (card.outerHTML !== tmp && card.dataset.h !== tmp) { card.outerHTML = tmp; const nc = $('#modal [data-roomcard]'); if (nc) nc.dataset.h = tmp; } } }
  }
  if (S && !ui.title) updateBars();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { sceneHTMLCache = ''; });

renderTitle();
requestAnimationFrame(frame);
// for testing in the console
window.__hh = { get S() { return S; }, step: (n) => { for (let i = 0; i < n; i++) stepMinute(); }, newGame: (n) => { newGame(n); hideTitle(); }, checkIn, checkOut, bestRoomFor, mgrStart, hire, buildFac, upgradeRoom, buildFloor, requestInspection, reqStatus, closeModal, saveTo, loadFrom };
})();
</script>
