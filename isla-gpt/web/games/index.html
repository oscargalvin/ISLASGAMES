<style>
/* A games shelf: one big square per game. Tap a square and the game opens full screen. */
:root {
  --bg: #1d1b3a;
  --bg2: #2a2654;
  --ink: #1d1b3a;
  --paper: #fffaf0;
  --sun: #ffd23f;
  --hot: #ff4f6d;
  --mint: #3ddc97;
  --muted: #b9b4e0;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--paper); }
body { font-family: var(--body); font-weight: 700; background: radial-gradient(circle at 20% 0%, #3b3480 0, transparent 45%), radial-gradient(circle at 90% 100%, #5a2050 0, transparent 40%), var(--bg); min-height: 100vh; }
main { max-width: 1040px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
header { text-align: center; margin-bottom: 26px; }
h1 { font-family: var(--display); font-weight: 400; margin: 0; font-size: clamp(38px, 8vw, 72px); line-height: 1; color: var(--sun); text-shadow: 0 5px 0 #000, 3px 0 0 #000, -3px 0 0 #000, 0 -3px 0 #000; transform: rotate(-2deg); text-wrap: balance; }
h1 span { color: var(--hot); }
header p { margin: 12px 0 0; color: var(--muted); font-size: 16px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.game { position: relative; display: flex; flex-direction: column; aspect-ratio: 1 / 1; padding: 0; border: 4px solid #000; border-radius: 26px; overflow: hidden; cursor: pointer; text-align: left; color: var(--paper); font: inherit; box-shadow: 0 8px 0 #000; transition: transform .12s ease, box-shadow .12s ease; }
.game:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 12px 0 #000; }
.game:active { transform: translateY(4px); box-shadow: 0 4px 0 #000; }
.game:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
.art { flex: 1; position: relative; overflow: hidden; }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.label { padding: 14px 84px 16px 18px; background: rgba(0, 0, 0, .55); backdrop-filter: blur(4px); }
.label b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; letter-spacing: .01em; }
.label span { font-size: 14px; color: #ddd8ff; }
.badge { position: absolute; top: 14px; left: 14px; padding: 4px 12px; border-radius: 999px; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 14px; border: 3px solid #000; }
.badge.new { background: var(--mint); }
.play { position: absolute; right: 14px; bottom: 14px; width: 56px; height: 56px; border-radius: 50%; background: var(--sun); border: 3px solid #000; display: grid; place-items: center; box-shadow: 0 4px 0 #000; }
.play svg { width: 24px; height: 24px; margin-left: 4px; }
.soon { cursor: default; background: repeating-linear-gradient(45deg, var(--bg2) 0 18px, #24214a 18px 36px); border-style: dashed; border-color: #6a64a8; box-shadow: none; display: grid; place-items: center; text-align: center; color: var(--muted); }
.soon:hover { transform: none; box-shadow: none; }
.soon b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--paper); display: block; }

/* the open game */
#player { position: fixed; inset: 0; z-index: 100; background: #000; }
#player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
#closeBtn { position: absolute; z-index: 2; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,.5); background: rgba(0, 0, 0, .55); color: #fff; font: 900 13px var(--body); letter-spacing: .04em; cursor: pointer; }
#closeBtn:hover { background: rgba(0, 0, 0, .8); }
#closeBtn:focus-visible { outline: 3px solid var(--sun); }
@media (prefers-reduced-motion: reduce) { .game, .game:hover { transition: none; transform: none; } }
</style>

<script>
(() => {
  const player = document.getElementById('player');
  let frame = null, lastBtn = null;
  function open(src, btn) {
    lastBtn = btn;
    frame = document.createElement('iframe');
    frame.src = src;
    frame.title = btn.querySelector('b').textContent;
    frame.allow = 'autoplay; fullscreen; gamepad';
    player.appendChild(frame);
    player.hidden = false;
    document.body.style.overflow = 'hidden';
    frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
  }
  function close() {
    if (frame) { frame.remove(); frame = null; }   // removing the frame stops the game and its sound
    player.hidden = true;
    document.body.style.overflow = '';
    if (lastBtn) lastBtn.focus();
  }
  document.querySelectorAll('.game[data-src]').forEach((b) => b.addEventListener('click', () => open(b.dataset.src, b)));
  document.getElementById('closeBtn').addEventListener('click', close);
})();
</script>
