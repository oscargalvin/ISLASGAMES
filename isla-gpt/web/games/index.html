<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isla &amp; Oscar's Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* A games shelf: one big square per game. Tap a square and the game opens full screen. */
:root {
  --bg: #1d1b3a;
  --bg2: #2a2654;
  --ink: #1d1b3a;
  --paper: #fffaf0;
  --sun: #ffd23f;
  --hot: #ff4f6d;
  --mint: #3ddc97;
  --muted: #b9b4e0;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--paper); }
body { font-family: var(--body); font-weight: 700; background: radial-gradient(circle at 20% 0%, #3b3480 0, transparent 45%), radial-gradient(circle at 90% 100%, #5a2050 0, transparent 40%), var(--bg); min-height: 100vh; }
main { max-width: 1040px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
header { text-align: center; margin-bottom: 26px; }
h1 { font-family: var(--display); font-weight: 400; margin: 0; font-size: clamp(38px, 8vw, 72px); line-height: 1; color: var(--sun); text-shadow: 0 5px 0 #000, 3px 0 0 #000, -3px 0 0 #000, 0 -3px 0 #000; transform: rotate(-2deg); text-wrap: balance; }
h1 span { color: var(--hot); }
header p { margin: 12px 0 0; color: var(--muted); font-size: 16px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.game { position: relative; display: flex; flex-direction: column; aspect-ratio: 1 / 1; padding: 0; border: 4px solid #000; border-radius: 26px; overflow: hidden; cursor: pointer; text-align: left; color: var(--paper); font: inherit; box-shadow: 0 8px 0 #000; transition: transform .12s ease, box-shadow .12s ease; }
.game:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 12px 0 #000; }
.game:active { transform: translateY(4px); box-shadow: 0 4px 0 #000; }
.game:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
.art { flex: 1; position: relative; overflow: hidden; }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.label { padding: 14px 84px 16px 18px; background: rgba(0, 0, 0, .55); backdrop-filter: blur(4px); }
.label b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; letter-spacing: .01em; }
.label span { font-size: 14px; color: #ddd8ff; }
.badge { position: absolute; top: 14px; left: 14px; padding: 4px 12px; border-radius: 999px; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 14px; border: 3px solid #000; }
.badge.new { background: var(--mint); }
.play { position: absolute; right: 14px; bottom: 14px; width: 56px; height: 56px; border-radius: 50%; background: var(--sun); border: 3px solid #000; display: grid; place-items: center; box-shadow: 0 4px 0 #000; }
.play svg { width: 24px; height: 24px; margin-left: 4px; }
.soon { cursor: default; background: repeating-linear-gradient(45deg, var(--bg2) 0 18px, #24214a 18px 36px); border-style: dashed; border-color: #6a64a8; box-shadow: none; display: grid; place-items: center; text-align: center; color: var(--muted); }
.soon:hover { transform: none; box-shadow: none; }
.soon b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--paper); display: block; }

/* the open game */
#player { position: fixed; inset: 0; z-index: 100; background: #000; }
#player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
#closeBtn { position: absolute; z-index: 2; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,.5); background: rgba(0, 0, 0, .55); color: #fff; font: 900 13px var(--body); letter-spacing: .04em; cursor: pointer; }
#closeBtn.gone { display: none; }
#eyeBtn { position: absolute; z-index: 2; left: calc(6px + env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(0, 0, 0, .45); color: #fff; font-size: 18px; line-height: 1; padding: 0; cursor: pointer; opacity: .75; }
#eyeBtn:hover { opacity: 1; background: rgba(0, 0, 0, .75); }
#eyeBtn:focus-visible { outline: 3px solid var(--sun); }
#closeBtn:hover { background: rgba(0, 0, 0, .8); }
#closeBtn:focus-visible { outline: 3px solid var(--sun); }
@media (prefers-reduced-motion: reduce) { .game, .game:hover { transition: none; transform: none; } }
</style>

<main>
  <header>
    <h1>Isla &amp; Oscar's <span>Games</span></h1>
    <p>Pick a square to play.</p>
  </header>
  <div class="shelf">
    <button class="game" data-src="dont-look-back.html" style="background:#07070a" aria-label="Play Don't Look Back">
      <div class="art">
        <img src="pics/dont-look-back.jpg" alt="" loading="lazy" style="object-position:left center">
        <span class="badge">Horror</span>
      </div>
      <div class="label"><b>DON'T LOOK BACK</b><span>Find 5 keys. It only moves when you look away.</span></div>
      <span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span>
    </button>

    <button class="game" data-src="yeet-the-human.html" style="background:#7cc8ff" aria-label="Play Yeet the Human">
      <div class="art">
        <img src="pics/yeet-the-human.jpg" alt="" loading="lazy">
        <span class="badge">Physics</span>
      </div>
      <div class="label"><b>YEET THE HUMAN</b><span>Fire a floppy human from a giant cannon.</span></div>
      <span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span>
    </button>

    <button class="game" data-src="night-shift.html" style="background:#050807" aria-label="Play Night Shift">
      <div class="art">
        <img src="pics/night-shift.jpg" alt="" loading="lazy">
        <span class="badge">Horror</span>
      </div>
      <div class="label"><b>NIGHT SHIFT</b><span>Some customers aren't human. Let them in?</span></div>
      <span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span>
    </button>

    <button class="game" data-src="floor-is-doom.html" style="background:#2a0a05" aria-label="Play Floor Is Doom">
      <div class="art">
        <img src="pics/floor-is-doom.jpg" alt="" loading="lazy" style="object-position:left center">
        <span class="badge">Survival</span>
      </div>
      <div class="label"><b>FLOOR IS DOOM</b><span>The floor turns to lava. Be the last one standing!</span></div>
      <span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span>
    </button>

    <button class="game" data-src="road-rage-x.html" style="background:linear-gradient(180deg,#ff7a59 0%,#7b2cbf 55%,#1b1036 100%)" aria-label="Play Road Rage X"><div class="art"><img src="pics/road-rage-x.jpg" alt="" loading="lazy"><span class="badge">Racing</span></div><div class="label"><b>ROAD RAGE X</b><span>Race, drift and escape the cops!</span></div><span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    <button class="game" data-src="teddy-exe.html" style="background:radial-gradient(circle at 50% 40%,#3a0a0e 0%,#120204 60%,#000 100%)" aria-label="Play Teddy.exe"><div class="art"><img src="pics/teddy-exe.jpg" alt="" loading="lazy"><span class="badge">Horror</span></div><div class="label"><b>TEDDY.EXE</b><span>Escape the toy factory!</span></div><span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    <button class="game" data-src="pizza-panic.html" style="background:linear-gradient(160deg,#e63946,#2a1a10)" aria-label="Play Pizza Panic"><div class="art"><img src="pics/pizza-panic.jpg" alt="" loading="lazy"><span class="badge new">New!</span></div><div class="label"><b>PIZZA PANIC</b><span>Deliver pizzas through a zombie town</span></div><span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    <button class="game" data-src="haunted-school.html" style="background:radial-gradient(circle at 50% 40%,#1d3a6b 0%,#0a1024 60%,#000 100%)" aria-label="Play Haunted School"><div class="art"><img src="pics/haunted-school.jpg" alt="" loading="lazy"><span class="badge">Horror</span></div><div class="label"><b>HAUNTED SCHOOL</b><span>Escape the ghost hall monitor!</span></div><span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    <button class="game" data-src="perfect-potion.html" style="background:linear-gradient(160deg,#ff5fb4 0%,#7a3cff 55%,#1b1036 100%)" aria-label="Play Perfect Potion"><div class="art"><img src="pics/perfect-potion.jpg" alt="" loading="lazy"><span class="badge">Magic</span></div><div class="label"><b>PERFECT POTION</b><span>Brew magic potions and collect pets!</span></div><span class="play"><svg viewBox="0 0 24 24" fill="#1d1b3a"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    <div class="game soon" aria-label="More games coming soon"><div><b>More soon…</b>Your next idea goes here!</div></div>
  </div>
</main>

<div id="player" hidden>
  <button id="closeBtn">✕ All games</button>
  <button id="eyeBtn" aria-label="Hide the All games button" title="Hide or show the All games button">👁️</button>
</div>

<script>
(() => {
  const player = document.getElementById('player');
  let frame = null, lastBtn = null;
  function open(src, btn) {
    lastBtn = btn;
    frame = document.createElement('iframe');
    frame.src = src;
    frame.title = btn.querySelector('b').textContent;
    frame.allow = 'autoplay; fullscreen; gamepad';
    player.appendChild(frame);
    player.hidden = false;
    document.body.style.overflow = 'hidden';
    frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
  }
  function close() {
    if (frame) { frame.remove(); frame = null; }   // removing the frame stops the game and its sound
    player.hidden = true;
    document.body.style.overflow = '';
    if (lastBtn) lastBtn.focus();
  }
  document.querySelectorAll('.game[data-src]').forEach((b) => b.addEventListener('click', () => open(b.dataset.src, b)));
  document.getElementById('closeBtn').addEventListener('click', close);
  // the eye button on the side hides or shows "All games" so it doesn't cover the game
  const closeBtn = document.getElementById('closeBtn'), eyeBtn = document.getElementById('eyeBtn');
  function setHidden(h) {
    closeBtn.classList.toggle('gone', h);
    eyeBtn.textContent = h ? '🙈' : '👁️';
    eyeBtn.setAttribute('aria-label', h ? 'Show the All games button' : 'Hide the All games button');
    try { localStorage.setItem('hub-hide-close', h ? '1' : ''); } catch (e) {}
  }
  let saved = false; try { saved = localStorage.getItem('hub-hide-close') === '1'; } catch (e) {}
  setHidden(saved);
  eyeBtn.addEventListener('click', () => { setHidden(!closeBtn.classList.contains('gone')); if (frame) try { frame.contentWindow.focus(); } catch (e) {} });
})();
</script>
<script src="live.js"></script>
